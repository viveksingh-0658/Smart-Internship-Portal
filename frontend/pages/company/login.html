<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Login</title>

  <link rel="stylesheet"
        href="../../assets/css/company-auth.css">
</head>

<body>

  <div class="auth-card">


<h1>🏢 Company Login</h1>

<p class="subtitle">
  Welcome Back
</p>

<form id="companyLoginForm">

  <input
    type="email"
    id="email"
    placeholder="Company Email"
    required
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    required
  >

  <button type="submit">
    Login
  </button>

</form>

<p id="message"></p>

<p>
  Don't have an account?
  <a href="register.html">
    Register
  </a>
</p>


  </div>

  <script src="../../assets/js/companyLogin.js"></script>

</body>
</html>
