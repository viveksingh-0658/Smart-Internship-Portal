<h1>🏢 Company Registration</h1>

<p class="subtitle">
  Join Smart Internship Portal
</p>

<form id="companyRegisterForm">

  <input type="text" id="companyName" placeholder="Company Name" required>

  <input type="email" id="email" placeholder="Company Email" required>

  <input type="password" id="password" placeholder="Password" required>

  <input type="text" id="industry" placeholder="Industry">

  <input type="text" id="location" placeholder="Location">

  <textarea
    id="description"
    rows="4"
    placeholder="Company Description"></textarea>

  <button type="submit">
    Register Company
  </button>

</form>

<p id="message"></p>

<p>
  Already have an account?
  <a href="login.html">Login</a>
</p>
